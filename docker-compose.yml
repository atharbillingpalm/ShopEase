services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopease-sqlserver
    environment:
      SA_PASSWORD: "YourPass@123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "2500:1433"
    volumes:
      - sqldata:/var/lib/mssql/data
    restart: unless-stopped

volumes:
  sqldata: