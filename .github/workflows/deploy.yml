name: Deploy ShopEase to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  deploy-react:
    runs-on: ubuntu-latest
    name: Deploy React to Azure Static Web Apps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/shopease-web
          output_location: dist
          app_build_command: npm run build

  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API to Azure Web App
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore packages
        run: dotnet restore "ShopEase.API/ShopEase.API/ShopEase.API/ShopEase.API.csproj"

      - name: Build API
        run: dotnet build "ShopEase.API/ShopEase.API/ShopEase.API/ShopEase.API.csproj" --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish "ShopEase.API/ShopEase.API/ShopEase.API/ShopEase.API.csproj" -c Release -o ./publish --no-restore

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: shopease-api-athar
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
